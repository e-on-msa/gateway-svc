server {
    # 외부에서 오는 80 포트 요청 받기
    listen 80;

    # Express Gateway로 모든 요청 전달
    location / {
        proxy_pass http://gateway-svc:8080; # 전부 Express Gateway로 넘기기
        # 클라이언트 실제 IP 등 정보를 헤더에 담아서 넘기기
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}